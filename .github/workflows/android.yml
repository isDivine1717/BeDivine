name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bedivine-release.jks
        {
          echo "storeFile=bedivine-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Prepare Release APKs
      id: prep
      run: |
        VER=$(grep 'extra\["bitchordVersionName"\]' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
        BETA=$(grep 'extra\["bitchordBetaSuffix"\]' build.gradle.kts | sed -E 's/.*"([^"]*)".*/\1/')
        if [ -n "$BETA" ]; then
          FULL_VER="${VER}-${BETA}"
        else
          FULL_VER="${VER}"
        fi
        echo "version=${FULL_VER}" >> $GITHUB_OUTPUT
        echo "tag=v${FULL_VER}" >> $GITHUB_OUTPUT

        mkdir -p dist
        for f in app/build/outputs/apk/prod/release/*.apk; do
          base=$(basename "$f")
          if [[ "$base" == *"universal"* ]]; then
            cp "$f" "dist/BeDivine-v${FULL_VER}.apk"
          elif [[ "$base" == *"arm64-v8a"* ]]; then
            cp "$f" "dist/BeDivine-v${FULL_VER}_arm64-v8a.apk"
          elif [[ "$base" == *"armeabi-v7a"* ]]; then
            cp "$f" "dist/BeDivine-v${FULL_VER}_armeabi-v7a.apk"
          elif [[ "$base" == *"x86_64"* ]]; then
            cp "$f" "dist/BeDivine-v${FULL_VER}_x86_64.apk"
          fi
        done

        for f in wearos/build/outputs/apk/prod/release/*.apk; do
          if [ -f "$f" ]; then
            cp "$f" "dist/BeDivineWear-v${FULL_VER}.apk"
          fi
        done
        ls -lh dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bedivine-prod-release-signed
        path: dist/BeDivine-v*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bedivine-wear-prod-release-signed
        path: dist/BeDivineWear-v*.apk

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.prep.outputs.tag }}"
        VER="${{ steps.prep.outputs.version }}"
        NOTES_FILE="RELEASE_NOTES.md"
        if [ ! -f "$NOTES_FILE" ]; then
          echo "BeDivine ${TAG}" > "$NOTES_FILE"
        fi
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "BeDivine ${TAG}" --notes-file "$NOTES_FILE"
          gh release upload "$TAG" dist/*.apk --clobber
        else
          gh release create "$TAG" dist/*.apk --title "BeDivine ${TAG}" --notes-file "$NOTES_FILE" --latest
        fi
